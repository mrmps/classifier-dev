[supervisord]
logfile=/var/log/classifier-supervisor.log
logfile_maxbytes=1MB
logfile_backups=2
pidfile=/run/classifier-supervisor.pid
childlogdir=/var/log

[unix_http_server]
file=/run/classifier-supervisor.sock
chmod=0600

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/classifier-supervisor.sock

[program:imajev]
command=/opt/classifier-imajev/run.sh model
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/classifier-imajev.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
redirect_stderr=true

[program:tunnel]
command=/opt/classifier-imajev/run.sh tunnel
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/classifier-tunnel.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
redirect_stderr=true
