<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1200, initial-scale=1" />
  <title>classifier.dev Open Graph image</title>
  <style>
    @font-face {
      font-family: "Bowlby One";
      src: url("./fonts/BowlbyOne-Regular.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      background: #a98cff;
      color: #190727;
      font-family: "Bowlby One", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    @media (color-gamut: p3) {
      body {
        background: color(display-p3 0.66 0.49 1);
        color: color(display-p3 0.075 0.018 0.13);
      }
    }

    h1 {
      margin: 0 0 0.04em;
      font-size: 154px;
      font-weight: 400;
      letter-spacing: -0.055em;
      line-height: 1;
      text-wrap: balance;
    }
  </style>
</head>
<body>
  <h1>classifier</h1>
</body>
</html>
