<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1200, initial-scale=1" />
  <title>classifier.dev Open Graph image</title>
  <style>
    @font-face {
      font-family: "Bowlby One";
      src: url("./fonts/BowlbyOne-Regular.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 1200px;
      height: 630px;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      /* The flat brand purple, lifted just enough that the lockup sits on a
         field rather than a slab. */
      background: #a98cff;
      color: #190727;
      font-family: "Bowlby One", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    @media (color-gamut: p3) {
      body {
        background: color(display-p3 0.66 0.49 1);
        color: color(display-p3 0.075 0.018 0.13);
      }
    }

    .wallpaper {
      position: absolute;
      inset: 0;
      width: 1200px;
      height: 630px;
    }

    .lockup {
      position: relative;
      display: flex;
      align-items: center;
      gap: 36px;
    }

    /* The favicon mark, inverted so it reads on the purple field: the same
       three scores with one winner, dark container instead of a purple one. */
    .mark { width: 126px; height: 126px; flex: none; display: block; }

    h1 {
      margin: 0 0 0.05em;
      font-size: 110px;
      font-weight: 400;
      letter-spacing: -0.055em;
      line-height: 1;
    }
  </style>
</head>
<body>
  <svg class="wallpaper" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g fill="#b39aff">
      <rect x="1044" y="-62" width="420" height="96" rx="48"/>
      <rect x="1044" y="74"  width="250" height="96" rx="48"/>
    </g>
    <g fill="#b39aff">
      <rect x="-240" y="470" width="420" height="96" rx="48"/>
    </g>
  </svg>
  <div class="lockup">
    <svg class="mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <rect width="32" height="32" rx="7" fill="#190727"/>
      <rect x="6" y="9"  width="20" height="4" rx="2" fill="#c9b3ff"/>
      <rect x="6" y="16" width="11" height="4" rx="2" fill="#7a63c4"/>
      <rect x="6" y="23" width="6"  height="4" rx="2" fill="#57458c"/>
    </svg>
    <h1>classifier.dev</h1>
  </div>
</body>
</html>
