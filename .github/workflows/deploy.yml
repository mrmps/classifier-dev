# Deploy the Worker when main moves.
#
# Squash-merging a pull request pushes to main, so a merge deploys. Secrets set
# with `wrangler secret put` are stored separately from the script and survive a
# deploy. Actions keeps a pooled runtime URL and a direct migration URL; only the
# pooled DATABASE_URL is supplied to the Worker.
name: deploy

on:
  push:
    branches: [main]
    # Files that cannot change what the Worker serves. Everything the site says
    # is generated from src/, so src/** is deliberately not on this list.
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "LICENSE"
      - "eval/**"
      - "skills/**"
      - ".github/workflows/publish-cli.yml"
  workflow_dispatch:

# One deploy at a time, and never cancel one that is mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci

      # The same three checks AGENTS.md asks for before a deploy.
      - name: Typecheck
        run: npm run typecheck
      - name: Worker tests
        env:
          NEON_MIGRATION_TEST_URL: ${{ secrets.NEON_MIGRATION_TEST_URL }}
        run: npm test
      - name: CLI tests
        run: node --test
        working-directory: cli

      # A missing secret should say which one, not fail later inside wrangler
      # with an authentication error that names nothing.
      - name: Check the secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STATS_KV_ID: ${{ secrets.STATS_KV_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: |
          missing=
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STATS_KV_ID DATABASE_URL DATABASE_URL_UNPOOLED REPORT_TO; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets not set:$missing"
            echo "Set them under Settings > Secrets and variables > Actions, or:"
            for name in $missing; do echo "  gh secret set $name"; done
            echo
            echo "CLOUDFLARE_API_TOKEN comes from dash.cloudflare.com > My Profile >"
            echo "API Tokens > Create Token > the \"Edit Cloudflare Workers\" template."
            exit 1
          fi

      # wrangler.toml is gitignored, so CI builds it from the example.
      - name: Write wrangler.toml
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STATS_KV_ID: ${{ secrets.STATS_KV_ID }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: node .github/render-wrangler.mjs

      # The repo's own pinned wrangler, so CI deploys with the version a
      # maintainer deploys with locally.
      - name: Build application
        run: npm run build
      - name: Verify spending through the built Worker and real Durable Objects
        run: npm run test:e2e:spending
      - name: Verify classification usage responses
        run: npm run test:e2e:usage
      - name: Verify long-context screening and judgment
        run: npm run test:e2e:long-context
      - name: Verify long-context workspace billing
        run: npm run test:e2e:long-context-billing
      - name: Save long-context verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: long-context-e2e
          path: |
            captures/long-context-e2e.json
            captures/long-context-billing.json
      - name: Save classification usage evidence
        uses: actions/upload-artifact@v4
        with:
          name: usage-e2e
          path: captures/usage-e2e.json
      - name: Save spending verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: spending-e2e
          path: captures/spending-e2e.json

      - name: Migrate account database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: npm run db:migrate

      - name: Require verified newsletter cutover
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun scripts/check-newsletter-cutover.ts

      # Open the verified destination before publishing code that writes to it.
      # If activation fails, no new Worker is published. Once activated, this
      # step is idempotent and normal subscriber changes are allowed.
      - name: Activate verified newsletter database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun scripts/check-newsletter-cutover.ts --activate

      # The chunklaya pair is optional and travels together: with both set as
      # repository secrets explicit chunklaya requests route there; with either
      # missing they are left out of the file, so an existing value survives
      # and unconfigured explicit requests answer chunklaya_unavailable. The
      # dgemma pair (the image-capable System One service) works the same way.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CHUNKLAYA_URL: ${{ secrets.CHUNKLAYA_URL }}
          CHUNKLAYA_TOKEN: ${{ secrets.CHUNKLAYA_TOKEN }}
          DGEMMA_URL: ${{ secrets.DGEMMA_URL }}
          DGEMMA_TOKEN: ${{ secrets.DGEMMA_TOKEN }}
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const { DATABASE_URL, CHUNKLAYA_URL, CHUNKLAYA_TOKEN, DGEMMA_URL, DGEMMA_TOKEN } = process.env;
            writeFileSync(process.env.RUNNER_TEMP + "/classifier-secrets.json",
              JSON.stringify({ DATABASE_URL, ...(CHUNKLAYA_URL && CHUNKLAYA_TOKEN ? { CHUNKLAYA_URL, CHUNKLAYA_TOKEN } : {}), ...(DGEMMA_URL && DGEMMA_TOKEN ? { DGEMMA_URL, DGEMMA_TOKEN } : {}) }), { mode: 0o600 });
          '
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/classifier-secrets.json"

      # A deploy that uploads and then serves a broken Worker should fail here
      # rather than in somebody's terminal.
      - name: Check what is live
        run: |
          sleep 5
          health=$(curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            --retry-all-errors https://classifier.dev/v1/health)
          echo "$health"
          echo "$health" | grep -q '"ok": true'
          # The anonymous probe runs from a hosted runner, whose IP the free-traffic
          # reputation gate may refuse (403 proxy_requires_payment). That is the
          # Worker answering with its own gate, not a broken deploy, so it passes
          # with a notice; every other non-200 fails. The body is always printed,
          # so a failure here says what was answered rather than only that it was.
          code=$(curl --silent --show-error -o classify.json -w '%{http_code}' -H 'accept: application/json' \
            https://classifier.dev/spam,not+spam/Win+a+free+iPhone)
          echo "classify -> HTTP $code"; cat classify.json; echo
          case "$code" in
            200) grep -Eq '"label": *"spam"' classify.json ;;
            403) grep -Eq '"code": *"proxy_requires_payment"' classify.json &&
                 echo "::notice::the anonymous probe was refused by the reputation gate for this runner's IP; the Worker is live" ;;
            *) echo "::error::anonymous classification answered HTTP $code"; exit 1 ;;
          esac
      - name: Check multidimensional classification end to end
        env:
          CLASSIFIER_BASE_URL: https://classifier.dev
          CLASSIFIER_API_KEY: ${{ secrets.CLASSIFIER_API_KEY }}
        run: npm run test:e2e
