name: publish cli
on:
  push:
    tags: ["cli-v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: node --test
      - run: |
          test "cli-v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} does not match package.json"; exit 1; }
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
