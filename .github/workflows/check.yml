name: checks
on:
  pull_request:
    branches: [main, "codex/**"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: spending-test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          NEON_MIGRATION_TEST_URL: ${{ secrets.NEON_MIGRATION_TEST_URL }}
      - run: node --test
        working-directory: cli
      - name: Verify paid reservations with concurrent PostgreSQL connections
        run: bun test tests/spending.e2e.test.ts
        env:
          POSTGRES_TEST_URL: postgres://postgres:spending-test@localhost:5432/postgres
      - name: Verify document admission under concurrent PostgreSQL requests
        run: bun e2e/document-admission.ts
        env:
          POSTGRES_TEST_URL: postgres://postgres:spending-test@localhost:5432/postgres
      - name: Render secret-free build configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: "00000000000000000000000000000000"
          STATS_KV_ID: "00000000000000000000000000000000"
          REPORT_TO: "ci@example.invalid"
        run: node .github/render-wrangler.mjs
      - name: Build application
        run: npm run build
      - name: Verify chat usage and authenticated analytics
        run: npm run test:e2e:chat-analytics
      - name: Save chat analytics evidence
        uses: actions/upload-artifact@v4
        with:
          name: chat-analytics-e2e
          path: captures/chat-analytics.json
      - name: Verify public chat and classification tools
        run: npm run test:e2e:chat
      - name: Save chat verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: chat-e2e
          path: captures/chat-e2e.json
      - name: Verify spending through the built Worker and real Durable Objects
        run: npm run test:e2e:spending
      - name: Verify classification usage responses
        run: npm run test:e2e:usage
      - name: Verify long-context screening and judgment
        run: npm run test:e2e:long-context
      - name: Verify URL scraping and billing
        run: npm run test:e2e:url
      - name: Save URL classification evidence
        uses: actions/upload-artifact@v4
        with:
          name: url-classification-e2e
          path: captures/url-classification.json
      - name: Verify long-context workspace billing
        run: npm run test:e2e:long-context-billing
      - name: Verify ten-million-token job and settlement
        run: npm run test:e2e:long-context-job
      - name: Verify one whole ten-million-token document upload
        run: npm run test:e2e:whole-document
      - name: Save long-context verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: long-context-e2e
          path: |
            captures/long-context-e2e.json
            captures/long-context-billing.json
            captures/long-context-job.json
            captures/whole-document.json
            captures/document-admission.json
      - name: Save classification usage evidence
        uses: actions/upload-artifact@v4
        with:
          name: usage-e2e
          path: captures/usage-e2e.json
      - name: Save spending verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: spending-e2e
          path: captures/spending-e2e.json
