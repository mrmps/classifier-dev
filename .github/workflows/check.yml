name: checks
on:
  pull_request:
    branches: [main, "codex/**"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test
        working-directory: cli
      - name: Render secret-free build configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: "00000000000000000000000000000000"
          STATS_KV_ID: "00000000000000000000000000000000"
          REPORT_TO: "ci@example.invalid"
        run: node .github/render-wrangler.mjs
      - name: Build application
        run: npm run build
