# Copy this to wrangler.toml and fill in your own values; wrangler.toml is
# gitignored so real account identifiers never land in the repository.
#
#   cp wrangler.example.toml wrangler.toml
#   npx wrangler kv namespace create STATS   # gives you the STATS id
#
name = "classifier-dev"
main = "src/server.ts"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2026-08-01"
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"

# Run fetch handlers near Oregon. This is a placement target, not a
# data-residency guarantee; assets remain globally served.
[placement]
region = "aws:us-west-2"

# Set the pooled runtime URL as a Worker secret, never a plaintext var. CI uses
# a separate direct DATABASE_URL_UNPOOLED secret for migrations.
[secrets]
required = ["DATABASE_URL"]

# Three digests a day at 08:00, 14:00 and 20:00 Pacific, and an alert check
# every fifteen minutes that stays silent unless something is wrong.
[triggers]
crons = ["0 15 * * *", "0 21 * * *", "0 3 * * *", "*/15 * * * *"]

[[kv_namespaces]]
binding = "STATS"
id = "YOUR_KV_NAMESPACE_ID"

[[analytics_engine_datasets]]
binding = "AE"
dataset = "classifier_events"


[[analytics_engine_datasets]]
binding = "JEV_AE"
dataset = "classifier_jev_attempts"

[[analytics_engine_datasets]]
binding = "ACCOUNT_AE"
dataset = "classifier_account_events"

[[analytics_engine_datasets]]
binding = "LONG_CONTEXT_AE"
dataset = "classifier_long_context_events"

# A local, permissive burst shield lets exact Durable Object admission overlap
# the fast inference call without exposing the single warm GPU to obvious floods.
[[ratelimits]]
name = "LAYA_FAST_ADMISSION"
namespace_id = "910001"

  [ratelimits.simple]
  limit = 60
  period = 60

[vars]
# Transfer-aware legacy objects were deployed before enabling admission here.
QUOTA_COORDINATOR_ENABLED = "true"
SPENDING_ENABLED = "true"
FREE_DAILY_USD = "100"
FREE_IP_DAILY_USD = "0.50"
OPERATOR_DAILY_USD = "2"
FREE_REQUEST_USD = "0.01"
FREE_IP_CONCURRENCY = "4"
FREE_CONCURRENCY = "128"
# One shared budget follows an anonymous label set across rotating callers.
FREE_LABEL_RPM = "5000"
FREE_LABEL_DAILY = "50000"
PAID_REQUEST_USD = "10"
SPUR_MONTHLY_LOOKUPS = "45000"
# Laya and Kev are hosted by Beam on its shared endpoints; there is no
# deployment of our own to point at. BEAM_API_KEY is a Worker secret, never a
# plaintext var, and it is the only credential either model needs.
LAYA_ENABLED = "true"
# Explicit model="chunklaya" retains the legacy document service when its
# Worker secrets CHUNKLAYA_URL and CHUNKLAYA_TOKEN are set. Automatic long
# context now uses Jev screening and judgment with funded-workspace admission.
CHUNKLAYA_ENABLED = "true"
# Enable only after account migration, pricing and Autumn reconciliation checks.
APP_ACCOUNTS_ENABLED = "true"
# Gateway free-tier 429s observed in production. Re-enable only after capacity is verified.
AI_GATEWAY_DISABLED = "true"
CLOUDFLARE_ACCOUNT_ID = "YOUR_CLOUDFLARE_ACCOUNT_ID"
REPORT_TO = "you@example.com"
NEWSLETTER_FROM = "classifier.dev <updates@classifier.dev>"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "RateLimiter"

[[durable_objects.bindings]]
name = "QUOTAS"
class_name = "QuotaCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Keeps SKILL.md a real markdown file rather than an escaped string literal.
[[rules]]
type = "Text"
globs = ["**/*.md"]
# Without this the rule replaces wrangler's default text rule rather than
# adding to it, and every deploy warns that .txt/.html/.sql will be ignored.
fallthrough = true

[[migrations]]
tag = "v2-billing"
new_sqlite_classes = ["BillingAccount"]

[[migrations]]
tag = "v3-workspace-billing"
deleted_classes = ["BillingAccount"]

[[migrations]]
tag = "v4-combined-quotas"
new_sqlite_classes = ["QuotaCoordinator"]

[[durable_objects.bindings]]
name = "FREE_BUDGET"
class_name = "FreeBudget"

[[migrations]]
tag = "v5-free-spending"
new_sqlite_classes = ["FreeBudget"]
