name = "classifier-dev"
main = "src/index.ts"
compatibility_date = "2026-08-01"
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"

# Three digests a day at 08:00, 14:00 and 20:00 Pacific, and an alert check
# every fifteen minutes that stays silent unless something is wrong.
[triggers]
crons = ["0 15 * * *", "0 21 * * *", "0 3 * * *", "*/15 * * * *"]

[[kv_namespaces]]
binding = "STATS"
id = "YOUR_KV_NAMESPACE_ID"

[[analytics_engine_datasets]]
binding = "AE"
dataset = "classifier_events"


[vars]
CLOUDFLARE_ACCOUNT_ID = "YOUR_CLOUDFLARE_ACCOUNT_ID"
REPORT_TO = "miryaboy@gmail.com"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Keeps SKILL.md a real markdown file rather than an escaped string literal.
[[rules]]
type = "Text"
globs = ["**/*.md"]
